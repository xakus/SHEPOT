# SHEPOT — сборка пакета и зависимости по ОС.
# Установка для разработки:  pip install -e ".[gpu,dev]"
# Обычная установка:         pip install .        (Windows/Linux + GPU: ".[gpu]")

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shepot"
dynamic = ["version"]
description = "Push-to-talk диктовка (faster-whisper) и чтение вслух (Piper) для Linux, Windows и macOS"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"          # piper-tts распространяется под GPL-3.0
authors = [{ name = "xakus" }]
dependencies = [
    "faster-whisper>=1.2",
    "numpy>=1.26",
    "sounddevice>=0.5",
    "huggingface_hub>=0.34",
    "tqdm>=4.66",
    "piper-tts>=1.3",
    "onnxruntime>=1.20",
    "pillow>=11",
    # Linux: клавиши через /dev/input; GTK/AppIndicator — PyGObject (или системный python3-gi)
    "evdev>=1.7; sys_platform == 'linux'",
    # Windows и macOS: хук клавиатуры, трей, буфер обмена
    "pynput>=1.8; sys_platform != 'linux'",
    "pystray>=0.19; sys_platform != 'linux'",
    "pyperclip>=1.9; sys_platform != 'linux'",
]

[project.optional-dependencies]
# cuBLAS + cuDNN для распознавания на видеокарте NVIDIA (на macOS CUDA нет)
gpu = [
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12==9.*; sys_platform != 'darwin'",
]
# GTK-трей в venv без системного python3-gi
gtk = ["PyGObject>=3.42; sys_platform == 'linux'"]
dev = ["pytest>=8", "pyinstaller>=6.11", "ruff>=0.6"]

[project.scripts]
shepot = "shepot.app:main"

[project.urls]
Homepage = "https://github.com/xakus/SHEPOT"

[tool.setuptools.dynamic]
version = { attr = "shepot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]
