# Сборка SHEPOT на Linux, Windows и macOS.
# - каждый push / pull request: тесты + сборка + самопроверка собранной программы;
# - тег vX.Y.Z: всё то же + GitHub Release с установщиками для скачивания.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: зависимости
        run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  build:
    name: сборка ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: linux-x86_64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-14,       target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ---------- Linux ----------
      - name: освободить место (CUDA-библиотеки весят гигабайты)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: системные пакеты (GTK, AppIndicator, AT-SPI, PortAudio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-atspi-2.0 \
            libportaudio2 xvfb
      - name: зависимости (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install ".[gpu,dev]" "PyGObject<3.51" pycairo
      - name: сборка (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh
      - name: самопроверка сборки (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dist/SHEPOT/SHEPOT --selftest
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a release/*.AppImage --selftest

      # ---------- Windows ----------
      - name: зависимости (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install ".[gpu,dev]"
      - name: сборка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: самопроверка сборки (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # SHEPOT.exe без консоли: вывод пишется в %APPDATA%\SHEPOT\shepot-console.log
          $p = Start-Process -FilePath dist\SHEPOT\SHEPOT.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:APPDATA\SHEPOT\shepot-console.log" -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "selftest: код $($p.ExitCode)" }

      # ---------- macOS ----------
      - name: зависимости (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install ".[dev]"
      - name: сборка (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/build_macos.sh
      - name: самопроверка сборки (macOS)
        if: runner.os == 'macOS'
        run: dist/SHEPOT.app/Contents/MacOS/SHEPOT --selftest

      - uses: actions/upload-artifact@v4
        with:
          name: SHEPOT-${{ matrix.target }}
          path: release/*
          retention-days: 7
          compression-level: 0     # внутри уже сжатые установщики

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: версия тега совпадает с версией программы
        run: |
          V=$(python3 -c 'import sys; sys.path.insert(0, "src"); import shepot; print(shepot.__version__)')
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "тег ${GITHUB_REF_NAME}, а в shepot/__init__.py версия $V"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -lh release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Что скачать
            | ОС | Файл |
            |---|---|
            | Windows 10/11 | `SHEPOT-Setup-*.exe` — установщик (или `*-windows-x64.zip` — без установки) |
            | macOS (Apple Silicon M1–M4) | `*-macos-arm64.dmg` |
            | macOS (Intel) | `*-macos-x64.dmg` |
            | Linux | `*-linux-x86_64.AppImage` (или `.tar.gz`) |

            Модели распознавания и голоса скачиваются при первом запуске (из меню в трее).
            Видеокарта NVIDIA используется автоматически на Windows и Linux; на macOS — только CPU.
            Подробности установки — в README.
